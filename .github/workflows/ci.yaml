name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/*'  

jobs:
  build-and-push: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 커밋 메시지에서 태그 추출 (특수문자 제거 및 길이 제한)
      - name: Get Commit Message for Tag
        id: vars
        run: |
          # 태그로 사용하기 부적절한 문자를 제거하고 50자로 제한
          RAW_MSG=$(git log -1 --pretty=%B | tr -dc '[:alnum:]' | cut -c1-50)
          echo "COMMIT_TAG=${RAW_MSG}" >> $GITHUB_ENV

      # 2. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 추가: Buildx builder 생성
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. 이미지 빌드 및 푸시 (DOCKER_REPO 시크릿 사용)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ env.COMMIT_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max  
